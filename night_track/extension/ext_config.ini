[INCLUDE]
INCLUDE = common/conditions.ini, common/Benner900conditions.ini, common/materials_track.ini

[RAIN_FX]
PUDDLES_MATERIALS = ?Asphalt?, Concrete
SOAKING_MATERIALS = ?Asphalt?, Concrete
SMOOTH_MATERIALS = CurbPaint?
ROUGH_MATERIALS = Grass?
LINES_MATERIALS = 
LINES_FILTER_MATERIALS = 

[SHADER_REPLACEMENT_0]
MATERIALS = Track
PROP_... = ksAmbient, 0.25 ; (0.15 dark - 0.5 light) Controls base brightness under shadow/no lighting
PROP_... = ksDiffuse, 0.45 ; (0.15 dark - 0.5 light) Controls brightness of lit surfaces (no shadow)
PROP_... = ksSpecular, 0.1 ; (0.05 dull - 1.0 shiny) Controls brightness of lighting source reflection
PROP_... = ksSpecularEXP, 20 ; (5 matte - 1000 polished) Controls width of lighting source reflection and the blurriness of general reflections (lower is wider/blurrier, higher is sharper)
PROP_... = sunSpecular, 6 ; (0 dull - 10 shiny) Controls brightness of the special lighting source reflection from the sun
PROP_... = sunSpecularEXP, 600 ; (200 matte - 1000 polished) Controls width of the special lighting source reflection from the sun (lower is wider, higher is sharper)
PROP_... = fresnelMaxLevel, 0.15 ; (0 plastic - 1 metal/chrome) Controls clamped maximum amount of metallic effect
PROP_... = fresnelEXP, 6 ; (2 - 6) Controls falloff of metallic effect
PROP_... = fresnelC, 0.03 ; (0.01 - 0.05) Controls minimum level of metallic effect

[SPECTATORS]
; list of meshes used for custom spectators (not "camera_facing.ini" thing), to hide if user chose to hide spectators in certain modes
MESHES = Seat?

[LIGHT_SERIES_...]
CONDITION = NIGHT_SHARP
MATERIALS = sidelights  ; or, you could use "MESHES = material:glowing_material?"
DIRECTION = NORMAL
FADE_AT = 700
SPOT= 90
COLOR= 0.95, 0.7, 0.5, 20
RANGE = 40
SHADOWS_HALF_RESOLUTION=0
SPOT_SHARPNESS = 0.6
OFFSET = X, Y, Z  ; optional offset in meters

